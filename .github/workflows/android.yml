name: Android RG-00

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verificar fuentes y compilar sin firmas
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verificar contrato inicial
        run: python3 tools/check_rg00.py
