name: RobGuard Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Pruebas, lint y compilación sin firmas de distribución
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDiagnostic --no-daemon
      - name: Verificar contrato RS-05
        run: python3 tools/check_rg00.py
      - name: APK de desarrollo para pruebas manuales (no Release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RobGuard-RG01-diagnostico
          path: app/build/outputs/apk/diagnostic/app-diagnostic.apk
          if-no-files-found: error
          retention-days: 7
