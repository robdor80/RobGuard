name: RG-03 Firestore Security Rules (staging)
on:
  pull_request:
    paths:
      - 'firestore.rg03.rules'
      - 'firebase.rg03-emulator.json'
      - 'tests/firestore-rg03.test.mjs'
      - 'package.json'
      - '.github/workflows/rg03-firestore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase test tools
        run: npm install --no-audit --no-fund
      - name: Test direct reads, writes, revocation and wipe authorization in emulator
        run: npm run test:rules
